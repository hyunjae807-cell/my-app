name: MORI Daily Kakao Briefing

on:
  schedule:
    # 1) 평일(월~금) 한국 시간 07:00 KST (UTC 일~목 22:00)
    - cron: '0 22 * * 0-4'
    # 2) 주말(토~일) 한국 시간 10:00 KST (UTC 토,일 01:00)
    - cron: '0 1 * * 6,0'
  # 지금 당장 수동으로 테스트 실행할 수 있는 버튼 활성화
  workflow_dispatch:

jobs:
  send_briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 3.10 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install requests timetree-exporter

      - name: 카카오톡 브리핑 생성 및 발송
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_AUTH_CODE: ${{ secrets.KAKAO_AUTH_CODE }}
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
          TIMETREE_CALENDAR_CODE: ${{ secrets.TIMETREE_CALENDAR_CODE }}
        run: |
          python send_daily_briefing.py

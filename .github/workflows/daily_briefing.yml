name: MORI Daily Kakao Briefing

on:
  schedule:
    # 🌟 한국 시간(KST) 매일 아침 06:55 (UTC 21:55) 자동 실행
    # (0분 정각 대기열 지연을 피해 7시 정각 전에 여유 있게 도착합니다)
    - cron: '55 21 * * *'
  workflow_dispatch: # Actions 탭에서 [Run workflow] 수동 실행 지원

jobs:
  send_briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 카카오톡 브리핑 생성 및 발송
        env:
          # 🌟 Secrets에 어떤 이름으로 등록되어 있어도 둘 다 매핑되도록 처리
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID || secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIMETREE_TOKEN: ${{ secrets.TIMETREE_TOKEN }}
          TIMETREE_CALENDAR_ID: ${{ secrets.TIMETREE_CALENDAR_ID }}
        run: python send_daily_briefing.py

name: MORI Daily Kakao Briefing

on:
  schedule:
    # 🌟 UTC 21:55 = 한국 시간(KST) 매일 오전 6시 55분
    # (0분 정각에는 깃허브 서버 대기열이 밀리므로 5분 일찍 설정하면 7시 정각 전에 딱 도착합니다)
    - cron: '55 21 * * *'
  workflow_dispatch: # 수동 실행 버튼 유지


jobs:
  send_briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 3.10 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install requests timetree-exporter

      - name: 카카오톡 브리핑 생성 및 발송
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_AUTH_CODE: ${{ secrets.KAKAO_AUTH_CODE }}
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
          TIMETREE_CALENDAR_CODE: ${{ secrets.TIMETREE_CALENDAR_CODE }}
        run: |
          python send_daily_briefing.py
